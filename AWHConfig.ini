; Adaptive Weapon Handling -- Data\Config\AWHConfig\AWHConfig.ini
;
; Tilts the first person weapon by camera pitch: a resting pose that varies
; smoothly with where you look, and holds still when you do. On top of that
; sits a fully relaxed pose -- one fixed angle whatever the camera is doing --
; reached with a hotkey or by standing around long enough.
;
; Motion-dependent inertia is not this mod's job -- use B42 Inertia or similar.
;
; IMPORTANT: this replaces the quest script version of the mod. Remove or
; disable that script, otherwise both will be adjusting the same settings.

[Settings]

; Master switch. 0 leaves the game completely untouched.
Enabled=1

; 1 = stop adjusting while the player is in combat.
DisableInCombat=1

; 1 = only adjust while a weapon is drawn.
RequireWeaponOut=1

; Seconds to ease towards the curve's output as the camera pitches.
;
; Fast on purpose: this is the weapon following your aim, and lagging it reads
; as sloppiness. 0 applies the curve directly.
SmoothingSeconds=0.06

; Seconds to settle into the relaxed pose, from the hotkey or from going idle.
;
; Separate from the tracking above, and slower: this is the weapon being let
; down, which should look like a deliberate movement rather than a snap.
; 0.5 is noticeably languid.
PoseBlendSeconds=0.30

; Seconds to come back the other way -- out of the relaxed pose, and out of the
; pose entirely when the weapon gets busy.
;
; Faster than the above on purpose. Raising a weapon is a reaction, not a
; stretch, and this is the transition you see when you open fire.
PoseDropSeconds=0.15

; Pin the engine's own first person weapon lag to neutral.
;
; That lag reacts to how fast you swing the camera and decays once you stop.
; Leave this at 1 if a dedicated inertia mod is handling that, so the two do not
; stack. The game setting itself is not modified -- only the one read that
; drives the hands is substituted, so nothing else in the game is affected.
NeutraliseVanillaLag=1

; --- When the pose stands down -----------------------------------------------

; Drop the pose while the engine considers the weapon busy: firing, reloading,
; equipping, melee, and any idle playing on the player.
;
; This asks the engine the same three questions it asks itself right after
; reading the follow multiplier, rather than keeping a parallel list that would
; drift out of step with it.
SuppressWhenHandsBusy=1

; Drop the pose while a menu or the console is open.
SuppressInMenus=1

; Drop the pose while a script has taken player controls away.
;
; This is the only thing that catches mods driving the first person arms
; outside the animation system. Realtime Pip-Boy Map is the example: it raises
; the pip-boy with kNVSE's ActivateAnim, which runs the sequence straight on the
; controller manager, so no anim group is ever set and the test above is blind
; to it -- which is also why kNVSE's own animation display shows nothing. What
; it does do is disable player controls for as long as the map is up.
;
; Turn this off if a quest or mod that disables controls for a long stretch ends
; up holding the pose down when it should not.
SuppressWhenControlsDisabled=1

; Which controls count, as a sum, one value per DisablePlayerControls argument:
;
;   1 movement    2 pip-boy    4 fighting    8 POV
;  16 looking    32 sneaking  64 menu      128 activate
;
; 255 = any of them, which is the safe default. Narrow it only if you have found
; the specific one you care about.
ControlSuppressMask=255

; A HUD tile trait to watch, relative to HUDMainMenu. Non-zero drops the pose.
; Leave empty to switch the check off.
;
; This is for mods whose state never reaches the animation system and lives only
; in another plugin's private storage -- but which do drive the interface. The
; default watches Realtime Pip-Boy Map: it sets _ToggleUpdate on its minimap
; tile to 1 while the map is raised and back to 0 when it is put away.
;
; Only "non-zero means busy" traits work here. The same mod also sets
; JDC\_visible_stent and ReticleCenter\reticle_center\alpha to 0 while the map
; is up, which is the wrong way round for this test.
;
; A missing path counts as "not there" rather than as zero, so a menu you do not
; have installed cannot hold the pose down.
;
; AWHConfig.log prints "UI trait <path> = N" whenever the value changes. If that
; line never appears, the path does not resolve -- check spelling and that the
; mod supplying the tile is installed.
SuppressUITrait=ModernMinimap\_ToggleUpdate

; --- Pose --------------------------------------------------------------------
;
; This tilts the first person node itself. Unlike lag it does not decay, so it
; is a pose rather than a transient.
;
; Two signs run opposite ways round, which is easy to trip over:
;   camera pitch  -- negative looking UP, positive looking DOWN
;   tilt          -- positive tilts the hands DOWN, negative UP

; The default pose, always on: "pitch:degrees" points, ascending by pitch, up to
; 16 of them, straight lines between and the end values held beyond the ends.
;
; This one is symmetric: level at the horizon, hands progressively lowered as
; the view leaves it in either direction. Scale the four outer values together
; to make the effect stronger or weaker; raise the middle entry to sit lowered
; at the horizon too.
;
; Watch the sign. Negative values lift the weapon above your line of sight,
; which rarely looks like anything you want.
PoseCurve=-89:13, -45:7, 0:0, 45:7, 89:13

; Multiplies every value in the curve above. The shape is a string and so cannot
; be edited from the MCM menu; this is the one knob over it that can be.
PoseCurveScale=1.0

; --- Relaxed pose ------------------------------------------------------------
;
; A single tilt held whatever the camera is doing, replacing the curve while it
; is active rather than adding to it. This is the character having stopped
; paying attention, so it does not track your aim at all.

; The angle, in degrees down. Matching the ends of the curve above keeps the
; two poses in the same family; go deeper for a more obvious stand-down.
RelaxedPoseDegrees=13.0

; --- Heavy weapons -----------------------------------------------------------

; Scales both poses while a heavy weapon is in hand.
;
; Something braced against the shoulder does not hang as low as a pistol, so the
; whole pose shrinks rather than getting its own curve. 0.667 is a third off,
; which is the 1.5x smaller this was asked for.
HeavyWeaponScale=0.667

; Which weapon animation types count as heavy, as a comma separated list.
;
; These are the weapon's "Animation Type" in the GECK, read straight off the
; equipped weapon:
;
;    0 hand to hand    1 melee 1H     2 melee 2H     3 pistol
;    4 pistol energy   5 rifle        6 automatic    7 rifle energy
;    8 handle          9 launcher    10 grenade     11 mine
;   12 lunchbox mine  13 thrown
;
; 8 and 9 are the two-handed Handle and Launcher sets: miniguns, gatling
; lasers, flamers, missile and grenade launchers.
;
; AWHConfig.log prints "Weapon animation type N" every time you swap weapons,
; and 255 when nothing is equipped. Draw the gun you care about, read N out of
; the log, put it in this list.
;
; Leave the list empty to switch the whole heavy-weapon lookup off.
HeavyWeaponTypes=8, 9

; Key that switches the relaxed pose on and off, as a decimal DirectInput
; scancode. 0 = no hotkey. Ignored while a menu or the console is open.
;
;   Z 44   X 45   C 46   V 47   B 48   N 49   M 50
;   Q 16   E 18   R 19   F 33   G 34   H 35
RelaxedPoseToggleKey=44

; Keep the relaxed pose through a suppression while out of combat.
;
; Without this, one shot at a passing gecko puts the weapon back on the curve
; until you press the key again or stand still for the full delay below. With
; it, the pose still drops for the shot -- fast, over PoseDropSeconds -- and
; then eases back down to the relaxed angle over PoseBlendSeconds once the shot
; is done. Only the latch survives, not the pose itself.
;
; In combat the latch is dropped as before, so the weapon stays up in a fight.
KeepRelaxedOutOfCombat=1

; Seconds of doing nothing before the weapon relaxes on its own. 0 = never.
;
; "Doing nothing" means none of the suppressions above are in force: firing,
; reloading, drawing, a menu, or a script holding your controls all take the
; weapon back out of the relaxed pose and restart this clock.
;
; Looking around does not, deliberately. The pose is built to follow the camera,
; so cancelling it whenever the camera moves would defeat the point.
IdleRelaxSeconds=10.0

; --- Fallback ----------------------------------------------------------------
;
; Used only when PoseCurve is empty: a constant tilt plus a straight blend to
; these two values at +-89 degrees.
;
; Deliberately absent from the MCM menu. PoseCurve is set above and so these do
; nothing, and unlike the numeric settings there is no way for a menu to grey
; them out when a text setting is what decides whether they apply.
FallbackTiltDegrees=0.0
FallbackLeanUpDegrees=0.0
FallbackLeanDownDegrees=0.0
