[Translations]
$modDisplayName=Adaptive Weapon Handling
$modDescription=Опускает оружие от первого лица по углу наклона камеры, плюс полностью расслабленная поза по клавише или по таймеру. Изменения применяются через секунду после закрытия меню.

$pose=Поза
$relaxed=Расслабление
$relaxedPage=Расслабленная поза

$general=Общее
$curve=Кривая позы
$standDown=Когда поза отключается
$relaxedPose=Расслабленная поза
$transitions=Переходы

$secondsSuffix= с
$degreesSuffix= гр

$enabled=Включено
$enabledMouse=Главный выключатель. Выключено — игра не трогается вообще.

$requireWeaponOut=Только с оружием в руках
$requireWeaponOutMouse=Держать позу только когда оружие достано.

$disableInCombat=Отключать в бою
$disableInCombatMouse=Не опускать оружие, пока игрок в бою.

$neutraliseVanillaLag=Нейтрализовать ванильную инерцию оружия
$neutraliseVanillaLagMouse=Прижимает собственную инерцию рук движка к нейтральному значению, чтобы она не складывалась с отдельным модом инерции вроде B42 Inertia. Сама игровая настройка не переписывается — подменяется только то единственное чтение, которое управляет руками.

$poseCurveScale=Сила позы
$poseCurveScaleMouse=Умножает каждую точку PoseCurve. 1.00 — кривая как записана в ini; сама форма задаётся текстом и правится только там.

$smoothingSeconds=Сглаживание слежения
$smoothingSecondsMouse=За сколько оружие догоняет кривую при наклоне камеры. Намеренно коротко: это оружие следует за прицелом, и запаздывание читается как неряшливость. 0 применяет кривую напрямую.

$suppressWhenHandsBusy=Убирать, когда руки заняты
$suppressWhenHandsBusyMouse=Обнулять позу, пока движок считает оружие занятым: стрельба, перезарядка, доставание, ближний бой и любой idle на игроке.

$suppressInMenus=Убирать в меню
$suppressInMenusMouse=Обнулять позу, пока открыто меню или консоль.

$suppressWhenControlsDisabled=Убирать при отобранном управлении
$suppressWhenControlsDisabledMouse=Обнулять позу, пока управление забрал скрипт. Это единственное, что ловит моды, двигающие руки от первого лица мимо анимационной системы — Realtime Pip-Boy Map поднимает пип-бой так, что ни одна аниме-группа этого не видит, но управление на время карты отбирает. Выключите, если какой-то квест надолго забирает управление и держит позу опущенной без причины.

$relaxedPoseDegrees=Угол расслабления
$relaxedPoseDegreesMouse=Насколько опускается оружие в полностью расслабленной позе. Держится под этим углом при любом положении камеры — в отличие от кривой, за прицелом не следит вообще.

$relaxedPoseToggleKey=Клавиша расслабления
$relaxedPoseToggleKeyMouse=Включает и выключает расслабленную позу. Игнорируется, пока открыто меню или консоль.

$keepRelaxedOutOfCombat=Оставаться расслабленным вне боя
$keepRelaxedOutOfCombatMouse=Выстрел вне боя больше не возвращает оружие на кривую. Оно всё так же убирается на выстрел, а после плавно опускается обратно. В бою оружие остаётся поднятым, как раньше.

$idleRelaxSeconds=Расслабляться через
$idleRelaxSecondsMouse=Сколько секунд бездействия до того, как оружие опустится само. 0 — никогда. Стрельба, перезарядка, доставание, меню или скрипт, забравший управление, выводят из позы и перезапускают отсчёт. Осмотр по сторонам — нет: поза для того и сделана, чтобы следовать за камерой.

$poseBlendSeconds=Время опускания
$poseBlendSecondsMouse=За сколько оружие оседает в расслабленную позу. Медленно намеренно: это должно читаться как осознанное движение, а не как рывок.

$poseDropSeconds=Время подъёма
$poseDropSecondsMouse=За сколько оружие выходит из расслабленной позы. При включённом «Оставаться расслабленным вне боя» потеря позы от выстрела или перезарядки мгновенна, и это значение управляет только расслабленным переходом.

$heavy=Тяжёлое оружие
$heavyWeaponScale=Множитель для тяжёлого
$heavyWeaponScaleMouse=Масштабирует обе позы, пока в руках тяжёлое оружие — то, что упирается в плечо, не висит так же низко, как пистолет. 0.67 — на треть меньше. Какое оружие считать тяжёлым, задаёт список HeavyWeaponTypes в ini.

