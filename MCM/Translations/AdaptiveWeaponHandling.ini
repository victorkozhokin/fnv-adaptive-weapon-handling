[Translations]
$modDisplayName=Adaptive Weapon Handling
$modDescription=Rests the first person weapon by camera pitch, with a fully relaxed pose on a hotkey or on a timer. Changes apply within a second of closing this menu.

$pose=Pose
$relaxed=Relaxed
$relaxedPage=Relaxed Pose

$general=General
$curve=Pose Curve
$standDown=When The Pose Stands Down
$relaxedPose=Relaxed Pose
$transitions=Transitions

$secondsSuffix= s
$degreesSuffix= deg

$enabled=Enabled
$enabledMouse=Master switch. Off leaves the game completely untouched.

$requireWeaponOut=Only With A Weapon Drawn
$requireWeaponOutMouse=Hold the pose only while a weapon is out.

$disableInCombat=Off In Combat
$disableInCombatMouse=Stop posing the weapon while the player is in combat.

$neutraliseVanillaLag=Neutralise Vanilla Weapon Lag
$neutraliseVanillaLagMouse=Pins the engine's own first person weapon lag to neutral so it does not stack with a dedicated inertia mod such as B42 Inertia. The game setting itself is never written -- only the one read that drives the hands.

$poseCurveScale=Pose Strength
$poseCurveScaleMouse=Multiplies every point of PoseCurve. 1.00 is the curve as written in the ini; the shape itself is a text setting and has to be edited there.

$smoothingSeconds=Tracking Smoothing
$smoothingSecondsMouse=How long the weapon takes to catch up with the curve as you pitch the camera. Deliberately short -- this is the weapon following your aim, and lagging it reads as sloppiness. 0 applies the curve directly.

$suppressWhenHandsBusy=Drop While Hands Are Busy
$suppressWhenHandsBusyMouse=Zero the pose while the engine considers the weapon busy: firing, reloading, equipping, melee, and any idle playing on the player.

$suppressInMenus=Drop In Menus
$suppressInMenusMouse=Zero the pose while a menu or the console is open.

$suppressWhenControlsDisabled=Drop When Controls Are Taken
$suppressWhenControlsDisabledMouse=Zero the pose while a script has your controls. This is the only thing that catches mods driving the first person arms outside the animation system -- Realtime Pip-Boy Map raises the pip-boy in a way no anim group ever sees, but it does disable controls while the map is up. Turn it off if some quest that holds controls for a long stretch keeps the pose down when it should not.

$relaxedPoseDegrees=Relaxed Angle
$relaxedPoseDegreesMouse=How far the weapon drops in the fully relaxed pose. Held at this angle whatever the camera is doing -- unlike the curve, it does not track your aim at all.

$relaxedPoseToggleKey=Relax Hotkey
$relaxedPoseToggleKeyMouse=Switches the relaxed pose on and off. Ignored while a menu or the console has focus.

$keepRelaxedOutOfCombat=Stay Relaxed Out Of Combat
$keepRelaxedOutOfCombatMouse=Firing out of combat no longer puts the weapon back on the curve. It still drops for the shot, then eases back down to the relaxed angle afterwards. In a fight the weapon stays up as before.

$idleRelaxSeconds=Relax After
$idleRelaxSecondsMouse=Seconds of doing nothing before the weapon relaxes on its own. 0 never does. Firing, reloading, drawing, a menu or a script holding your controls all take it back out and restart the clock. Looking around does not -- the pose is built to follow the camera.

$poseBlendSeconds=Relax Time
$poseBlendSecondsMouse=How long the weapon takes to settle into the relaxed pose. Slow on purpose: it should read as a deliberate stand-down rather than a snap.

$poseDropSeconds=Raise Time
$poseDropSecondsMouse=How long the weapon takes to come back out of the relaxed pose. With Stay Relaxed Out Of Combat on, losing the pose to a shot or a reload is instant instead and this only governs the relaxed blend.

$heavy=Heavy Weapons
$heavyWeaponScale=Heavy Weapon Scale
$heavyWeaponScaleMouse=Scales both poses while a heavy weapon is in hand -- something braced against the shoulder does not hang as low as a pistol. 0.67 is a third off. Which weapons count is the HeavyWeaponTypes list in the ini.

